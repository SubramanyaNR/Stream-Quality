# =============================================================================
# config/registry.properties -- your EXISTING schema registry
#
# sq.registry.type selects the protocol:
#   apicurio    Apicurio Registry v3 NATIVE API (JSON Schema artifacts)
#   confluent   Confluent REST API, spoken by: Confluent Schema Registry, Karapace, Redpanda's built-in
#               registry and Apicurio's compatibility endpoint. Aliases: karapace | redpanda | ccompat.
#               Supports JSON Schema and Avro (messages in the Confluent wire format: see sq.source.framing in kafka.properties).
#
# Examples
#   Apicurio native : type=apicurio   url=http://host:8080/apis/registry/v3
#   Confluent / CP  : type=confluent  url=http://schema-registry:8081      (auth: see below)
#   Karapace        : type=karapace   url=http://karapace:8081
#   Apicurio ccompat: type=ccompat    url=http://host:8080/apis/ccompat/v7
# =============================================================================
sq.registry.enabled=true
sq.registry.type=apicurio
sq.registry.url=http://host.docker.internal:8081/apis/registry/v3
sq.registry.group=default                # apicurio only

# Auth (optional)
# sq.registry.auth.type=basic            # none | basic | bearer
# sq.registry.auth.username=${env:REGISTRY_USER}
# sq.registry.auth.password=${env:REGISTRY_PASSWORD}

# topic -> artifact id (apicurio) / SUBJECT (confluent-style) used for plain, unframed JSON. {topic} is substituted.
# {topic}-value is Confluent's default TopicNameStrategy. Framed messages carry their schema id and ignore this.
sq.registry.artifact.id.template={topic}-value
sq.registry.refresh.interval.ms=300000

# Graceful degradation: registry down => structural checks skipped, statistical
# checks continue. Circuit breaker opens after N consecutive failures.
sq.registry.timeout.ms=3000
sq.registry.breaker.failures=3
sq.registry.breaker.reset.ms=60000
