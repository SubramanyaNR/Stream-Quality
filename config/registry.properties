# =============================================================================
# config/registry.properties -- EXISTING schema registry (Apicurio v3 native API)
# Nothing Confluent-specific. A later Confluent adapter = new sq.registry.type.
# =============================================================================
sq.registry.enabled=${env:REGISTRY_ENABLED}
sq.registry.type=apicurio
sq.registry.url=${env:REGISTRY_URL}
sq.registry.group=default

# Auth (optional)
# sq.registry.auth.type=basic            # none | basic | bearer
# sq.registry.auth.username=${env:REGISTRY_USER}
# sq.registry.auth.password=${env:REGISTRY_PASSWORD}

# topic -> artifactId mapping convention. {topic} is substituted.
sq.registry.artifact.id.template={topic}-value
sq.registry.refresh.interval.ms=300000

# Graceful degradation: registry down => structural checks skipped, statistical
# checks continue. Circuit breaker opens after N consecutive failures.
sq.registry.timeout.ms=3000
sq.registry.breaker.failures=3
sq.registry.breaker.reset.ms=60000
