# Per-topic / per-field thresholds. Changing requires a job restart in v1.
# Precedence: topics.T.fields.F.CHECK.KEY > topics.T.CHECK.KEY > defaults.CHECK.KEY
# Comparison is strictly "greater than": warn: 0.0 means "any null warns", not "everything warns".
window:
  size: 60s                  # tumbling windows over INGESTION time (when Flink parsed the record)
  max_out_of_orderness: 5s   # parallel-subtask skew tolerance; later records are dropped + counted (late_records metric)
  idle_timeout: 30s
event_time_field: event_time         # JSON path to the payload timestamp (epoch s/ms or ISO-8601): used ONLY for freshness; falls back to Kafka timestamp
history_windows: 30          # per-(check,field) lookback for baseline-relative checks (volume drop, cardinality drift)
rebaseline_after: 30         # only OK windows feed the baseline; a violation lasting longer than this many windows becomes the new normal

defaults:
  volume:      { warn_drop_pct: 30, fail_drop_pct: 60, min_history: 5, fail_on_zero: true }
  null_rate:   { warn: 0.05, fail: 0.20 }
  # factor = max(est/baseline, baseline/est) vs mean of last history_windows windows; either direction
  cardinality: { warn_ratio: 2.0, fail_ratio: 5.0, min_history: 5, min_baseline: 10 }
  freshness:   { warn_p95_ms: 30000, fail_p95_ms: 120000 }
  # seasonality: none | daily | weekly. daily compares with the SAME HOUR of previous days (needs one full day of
  # history; until then the last history_windows windows are used), so a normal overnight dip is not an alarm.
  # fail_on_zero still fires on an empty window; set it false for topics that are legitimately silent at night.
  # (add `seasonality: daily` to a topic or to defaults.volume to switch it on)
  # type_drift: share of values NOT of the field's usual JSON type (string/number/boolean/object/array; nulls ignored)
  type_drift:  { warn: 0.01, fail: 0.10, min_history: 5 }
  # schema_drift: top-level fields that appear (>= appear_min_rate of records) or vanish (< disappear_below) vs the
  # learned field set; value = number of drifted fields. enabled: false switches it off for a topic.
  schema_drift: { warn: 0, fail: 3, min_history: 5, min_presence: 0.5, appear_min_rate: 0.05, disappear_below: 0.01 }

topics:
  bank.dbo.transactions:
    fields:
      txn_id:      { required: true, null_rate: { warn: 0.0, fail: 0.01 } }
      account_id:  { required: true }
      customer_id: { cardinality: true }
  bank.app.clickstream:
    fields:
      event_id:    { required: true }
  bank.app.application_logs:
    fields:
      log_id:      { required: true }
