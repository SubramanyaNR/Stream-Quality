# =============================================================================
# config/kafka.properties  -- connection to your EXISTING Apache Kafka cluster
# Every key below is passed verbatim to the Kafka client (consumer + producer).
# The job adds NO Kafka-flavour assumptions: change this file, not the code.
# Values may reference env vars as ${env:NAME} (never commit secrets).
# =============================================================================

# ---- Brokers (KRaft: you talk to brokers only, never to controllers) --------
# Use the *advertised* listener the Flink containers can reach. If Kafka runs on
# your Docker host, use host.docker.internal:<port> and make sure that name is in
# the broker's advertised.listeners (see docs/KAFKA_CONNECTIVITY.md).
bootstrap.servers=host.docker.internal:9092

# ---- Security: choose ONE block -------------------------------------------
# A) PLAINTEXT (local dev)
security.protocol=PLAINTEXT

# B) SASL_PLAINTEXT + SCRAM-SHA-512 (recommended SASL mechanism on KRaft)
# security.protocol=SASL_PLAINTEXT
# sasl.mechanism=SCRAM-SHA-512
# sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${env:KAFKA_SASL_USERNAME}" password="${env:KAFKA_SASL_PASSWORD}";

# C) SASL_PLAINTEXT + PLAIN
# security.protocol=SASL_PLAINTEXT
# sasl.mechanism=PLAIN
# sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${env:KAFKA_SASL_USERNAME}" password="${env:KAFKA_SASL_PASSWORD}";

# D) SASL_SSL (SCRAM or PLAIN) -- add truststore
# security.protocol=SASL_SSL
# ssl.truststore.location=/opt/sq/config/certs/truststore.jks
# ssl.truststore.password=${env:KAFKA_TRUSTSTORE_PASSWORD}
# ssl.endpoint.identification.algorithm=https

# E) mTLS
# security.protocol=SSL
# ssl.truststore.location=/opt/sq/config/certs/truststore.jks
# ssl.truststore.password=${env:KAFKA_TRUSTSTORE_PASSWORD}
# ssl.keystore.location=/opt/sq/config/certs/keystore.jks
# ssl.keystore.password=${env:KAFKA_KEYSTORE_PASSWORD}
# ssl.key.password=${env:KAFKA_KEY_PASSWORD}

# ---- Consumer ---------------------------------------------------------------
# Monitor must never steal or commit into another app's group.
group.id=stream-quality-monitor
client.id.prefix=sq
# Used only when the group has no committed offsets. "latest" = monitor from now.
auto.offset.reset=latest
isolation.level=read_committed
max.poll.records=2000
fetch.min.bytes=1
fetch.max.wait.ms=500
session.timeout.ms=45000
request.timeout.ms=30000
# Pick up new partitions / topic-pattern matches every N ms (Flink KafkaSource)
partition.discovery.interval.ms=60000

# ---- Producer (dead-letter topic only) --------------------------------------
acks=all
enable.idempotence=true
compression.type=zstd
linger.ms=50
delivery.timeout.ms=120000

# =============================================================================
# Monitor-specific (prefixed `sq.`; stripped before handing props to the client)
# =============================================================================
# Topics to monitor: comma list and/or regex (regex wins if both set)
sq.source.topics=orders,payments
# sq.source.topic.pattern=^(orders|payments)\..*
sq.source.format=json

# Dead-letter topic: MUST already exist (scripts/create-dlq-topic.sh creates it)
sq.dlq.topic=sq.dead-letter
sq.dlq.fail.on.missing=true
