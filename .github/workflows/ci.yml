name: ci
on:
  push:
  pull_request:

jobs:
  unit-and-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      PGPASSWORD: postgres
      E2E_PG_HOST: 127.0.0.1
      E2E_PG_PORT: "5432"
      E2E_PG_ADMIN: postgres
      E2E_PG_ADMIN_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary pyyaml
      - name: create database and schema
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE sq"
          psql -h 127.0.0.1 -U postgres -d sq -v ON_ERROR_STOP=1 -f postgres/init/01_init.sql
      - name: unit tests (incl. Postgres sink tests)
        run: cd flink-job && mvn -B test
        env: { SQ_TEST_PG_URL: "jdbc:postgresql://127.0.0.1:5432/sq", SQ_TEST_PG_ADMIN_PASSWORD: postgres }
      - name: SQL, analytics, alert-sink and dashboard-query tests
        run: |
          python3 scripts/test_schema.py 127.0.0.1 5432 postgres sq
          python3 scripts/test_analytics.py
          python3 scripts/test_alert_sink.py
          python3 scripts/test_dashboard_queries.py
      - run: python3 observability/grafana/build_dashboards.py && git diff --exit-code observability/grafana/dashboards
      - name: prometheus rules are valid
        run: |
          docker run --rm -v "$PWD/observability/prometheus/rules:/r:ro" --entrypoint promtool prom/prometheus:v3.13.4 check rules /r/sq.yml

  e2e:
    runs-on: ubuntu-latest
    needs: unit-and-sql
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install psycopg2-binary
      - run: cd flink-job && mvn -B package -DskipTests
      - run: ./scripts/e2e.sh
