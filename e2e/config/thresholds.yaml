# e2e: short windows so the whole scenario runs in about 3 minutes
window: { size: 10s, max_out_of_orderness: 2s, idle_timeout: 20s }
event_time_field: event_time
history_windows: 30
rebaseline_after: 30
defaults:
  volume:       { warn_drop_pct: 30, fail_drop_pct: 60, min_history: 3, fail_on_zero: true }
  null_rate:    { warn: 0.05, fail: 0.20 }
  cardinality:  { warn_ratio: 2.0, fail_ratio: 5.0, min_history: 5, min_baseline: 10 }
  freshness:    { warn_p95_ms: 30000, fail_p95_ms: 120000 }
  type_drift:   { warn: 0.01, fail: 0.10, min_history: 3 }
  schema_drift: { warn: 0, fail: 3, min_history: 3 }
topics:
  e2e.orders:
    fields:
      id:     { required: true }
      amount: {}
