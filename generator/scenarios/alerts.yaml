# Used by scripts/e2e-alerts.sh (5 s windows). orders: healthy -> 25 s of 50% null customer_id -> healthy again.
topics:
  orders:
    rate: 20
    fields: {order_id: id, customer_id: {choice: 15}, amount: {float: [1, 500]}}
    phases:
      - {duration: 25}
      - {duration: 25, null_rates: {customer_id: 0.5}}
      - {duration: 50}
  payments:
    rate: 10
    fields: {payment_id: id, amount: {float: [1, 500]}}
    phases: [{duration: 100}]
