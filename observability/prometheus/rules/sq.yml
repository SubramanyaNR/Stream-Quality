# Flink exposes one gauge per (topic, check_type, field): 0 ok / 1 warn / 2 fail (latest window).
# Flink's Prometheus reporter puts the group KEY names into the metric name, hence the long name.
groups:
  - name: stream-quality
    rules:
      - record: sq:check_status
        expr: max by (topic, check_type, field) (flink_taskmanager_job_task_operator_topic_check_type_field_check_status)

      - alert: DataQualityFail
        expr: sq:check_status == 2
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.check_type }} FAIL on {{ $labels.topic }}{{ if $labels.field }}.{{ $labels.field }}{{ end }}"
          description: "Latest window violated the fail threshold. See the Violation log dashboard for details."

      - alert: DataQualityWarn
        expr: sq:check_status == 1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.check_type }} WARN on {{ $labels.topic }}{{ if $labels.field }}.{{ $labels.field }}{{ end }}"
          description: "Warning threshold exceeded for at least 2 minutes."

      - alert: QualityMonitorStalled
        expr: time() - max(flink_taskmanager_job_task_operator_last_window_end_seconds) > 300
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Quality monitor has produced no windows for 5 minutes (job stalled or Kafka unreachable)"

      - alert: QualityMonitorMissing
        expr: absent(flink_taskmanager_job_task_operator_last_window_end_seconds)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Quality monitor metrics are absent (Flink job not running?)"

      # --- The monitor's OWN health: if it falls behind, every windowed check is silently skewed. ---
      # Kafka-side backlog of the monitor's consumer (records), worst partition.
      - alert: QualityMonitorLagging
        expr: max(flink_taskmanager_job_task_operator_KafkaSourceReader_KafkaConsumer_records_lag_max) > 10000
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Quality monitor is {{ $value | humanize }} records behind on Kafka: its check results are skewed"
          description: "The monitor consumer lags the topics. Windows are over INGESTION time, so a backlog makes volume, freshness and drift checks wrong until it catches up. Raise parallelism or check the job."

      # Same thing in seconds: now minus the Kafka timestamp of the records being processed (needs CreateTime ~ wall clock).
      - alert: QualityMonitorBehind
        expr: max(flink_taskmanager_job_task_operator_consumer_delay_ms) > 60000
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Quality monitor processes records {{ $value | humanizeDuration }} after they were produced"
          description: "Consumption delay above 60s. Check results are skewed until the monitor catches up (or the producers are back-dating Kafka timestamps)."
