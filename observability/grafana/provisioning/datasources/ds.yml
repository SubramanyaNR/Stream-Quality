apiVersion: 1
datasources:
  - { name: ClickHouse, uid: sq-ch, type: grafana-clickhouse-datasource, isDefault: true,
      jsonData: { host: clickhouse, port: 9000, protocol: native, defaultDatabase: sq, username: sq_reader },
      secureJsonData: { password: sq_reader_pw } }
  - { name: Prometheus, uid: sq-prom, type: prometheus, url: "http://prometheus:9090" }
  - { name: Loki, uid: sq-loki, type: loki, url: "http://loki:3100" }
