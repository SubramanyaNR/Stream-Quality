# Kafka and Apicurio are EXTERNAL. This stack: Flink, PostgreSQL, Prometheus,
# Alertmanager, Grafana, Loki (+ Alloy log shipper, + tiny webhook receiver).
name: stream-quality

x-flink-common: &flink-common
  build: { context: ., dockerfile: flink/Dockerfile }
  image: stream-quality/flink:2.2.1
  extra_hosts: ["host.docker.internal:host-gateway"]   # reach Kafka/Apicurio on the Docker host (Linux needs this)
  env_file: [.env]
  volumes:
    - ./config:/opt/sq/config:ro                       # kafka.properties, registry.properties, thresholds.yaml
    - flink-checkpoints:/opt/flink/checkpoints
  networks: [sq]

services:
  postgres:
    image: postgres:17-alpine
    container_name: sq-postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: sq
      POSTGRES_USER: sq_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro       # runs once, on first start of an empty volume
    healthcheck:   # TCP check: during first-boot init the server only listens on its unix socket; also wait for the LAST init step (sq_reader role)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sq_admin -d sq && PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -U sq_admin -d sq -tAc \"SELECT 1 FROM pg_roles WHERE rolname = 'sq_reader'\" | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 40
    networks: [sq]

  postgres-maintenance:                                      # retention: purge old windows/heartbeats hourly
    image: postgres:17-alpine
    container_name: sq-postgres-maintenance
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      PGHOST: postgres
      PGUSER: sq_admin
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin}
      PGDATABASE: sq
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do psql -tAc \"SELECT sq.purge_old(${RESULTS_RETENTION_DAYS:-90}, ${HEARTBEAT_RETENTION_DAYS:-14})\"; sleep 3600; done"]
    restart: unless-stopped
    networks: [sq]

  flink-jobmanager:
    <<: *flink-common
    container_name: sq-flink-jm
    command: jobmanager
    ports: ["8082:8081"]                               # Flink UI (8082 avoids clashing with Apicurio on 8081)
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend.type: rocksdb
        state.backend.incremental: true
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/checkpoints/savepoints
        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: AT_LEAST_ONCE
        restart-strategy.type: exponential-delay
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview"]
      interval: 5s
      retries: 30

  flink-taskmanager:
    <<: *flink-common
    container_name: sq-flink-tm
    command: taskmanager
    depends_on: { flink-jobmanager: { condition: service_healthy } }
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2g
        taskmanager.memory.managed.fraction: 0.4       # RocksDB lives in managed memory
        state.backend.type: rocksdb
        state.backend.incremental: true
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

  flink-job-submit:                                    # one-shot: submits the job, then exits
    <<: *flink-common
    container_name: sq-flink-submit
    depends_on:
      flink-jobmanager: { condition: service_healthy }
      flink-taskmanager: { condition: service_started }
      postgres: { condition: service_healthy }
    restart: "no"
    entrypoint: ["/opt/flink/bin/submit-job.sh"]
    environment:
      JOB_JAR: /opt/flink/usrlib/stream-quality-job.jar
      SQ_CONFIG_DIR: /opt/sq/config
      POSTGRES_URL: jdbc:postgresql://postgres:5432/sq
      POSTGRES_USER: sq_writer
      POSTGRES_PASSWORD: sq_writer_pw

  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: sq-prometheus
    ports: ["9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d", "--web.enable-lifecycle"]
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    networks: [sq]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: sq-alertmanager
    ports: ["9093:9093"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes: ["./observability/alertmanager:/etc/alertmanager:ro", "am-data:/alertmanager"]
    networks: [sq]

  alert-sink:                                          # demo webhook receiver; logs payloads -> Loki
    build: ./tools/alert-sink
    container_name: sq-alert-sink
    ports: ["5001:5001"]
    networks: [sq]

  loki:
    image: grafana/loki:3.7.8
    container_name: sq-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    ports: ["3100:3100"]
    volumes: ["./observability/loki/loki.yml:/etc/loki/loki.yml:ro", "loki-data:/loki"]
    networks: [sq]

  alloy:                                               # Promtail is EOL; Alloy ships container logs -> Loki
    image: grafana/alloy:v1.20.1
    container_name: sq-alloy
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [sq]

  grafana:
    image: grafana/grafana:13.0.10
    container_name: sq-grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/topic-health.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: { postgres: { condition: service_healthy } }
    networks: [sq]

networks: { sq: { name: sq } }
volumes: { pg-data: {}, prom-data: {}, am-data: {}, loki-data: {}, grafana-data: {}, flink-checkpoints: {} }
